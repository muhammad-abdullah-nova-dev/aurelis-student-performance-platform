<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Aurelis — Reset Password</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    /* ── DESIGN TOKENS ── */
    :root {
      --brand-primary:        #C63D2F;
      --brand-primary-hover:  #B03527;
      --brand-primary-active: #9E2E22;
      --brand-secondary:      #3E7A54;
      --brand-accent:         #D9A441;

      --background:       #F7F1E8;
      --surface:          #EFE6D4;
      --surface-elevated: #FDFAF5;
      --surface-muted:    #EAE0CE;

      --text-primary:   #1E1A17;
      --text-secondary: #4A3F36;
      --text-muted:     #7A6E64;
      --text-disabled:  #B0A89E;
      --text-inverse:   #FDFAF5;

      --border:        #DDD4C0;
      --border-subtle: #EAE0CE;
      --border-strong: #C4B99E;

      --success:        #2E6B45;
      --success-bg:     rgba(46,107,69,0.08);
      --success-border: rgba(46,107,69,0.25);
      --warning:        #B8832A;
      --warning-bg:     rgba(217,164,65,0.10);
      --warning-border: rgba(217,164,65,0.30);
      --danger:         #C63D2F;
      --danger-bg:      rgba(198,61,47,0.08);
      --danger-border:  rgba(198,61,47,0.25);

      --shadow-xs: 0 1px 3px rgba(30,26,23,0.08);
      --shadow-sm: 0 2px 8px rgba(30,26,23,0.08), 0 1px 3px rgba(30,26,23,0.05);
      --shadow-md: 0 4px 16px rgba(30,26,23,0.10), 0 2px 6px rgba(30,26,23,0.06);
      --shadow-lg: 0 8px 32px rgba(30,26,23,0.12), 0 4px 12px rgba(30,26,23,0.07);

      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --radius-xl: 20px;

      /* Legacy aliases — no circular ref */
      --bg: var(--background); --card: var(--surface-elevated);
      --accent: var(--brand-primary); --accent2: var(--brand-secondary);
      --text: var(--text-primary); --muted: var(--text-muted);
      --error: var(--brand-primary);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--background); color: var(--text-primary);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 24px;
      background-image: radial-gradient(circle, rgba(30,26,23,0.055) 1px, transparent 1px);
      background-size: 28px 28px;
    }

    .blob { display: none; }

    .auth-wrapper {
      position: relative; z-index: 1;
      width: 100%; max-width: 440px;
      animation: fadeUp 0.55s ease both;
    }
    @keyframes fadeUp { from{opacity:0;transform:translateY(22px)} to{opacity:1;transform:translateY(0)} }

    .logo-link {
      display: flex; align-items: center; justify-content: center;
      text-decoration: none; margin-bottom: 22px;
    }
    .logo-text {
      font-family: 'Fraunces', serif; font-size: 1.4rem; font-weight: 700;
      color: var(--text-primary); letter-spacing: -0.4px;
    }
    .logo-text span { color: var(--brand-primary); }

    .card {
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 34px 30px;
      box-shadow: var(--shadow-lg);
      position: relative; overflow: hidden;
    }
    .card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: var(--brand-primary);
    }

    h1 {
      font-family: 'Fraunces', serif; font-size: 1.35rem;
      margin-bottom: 6px; font-weight: 700;
      color: var(--text-primary); letter-spacing: -0.3px;
    }
    .sub {
      color: var(--text-muted); font-size: 0.84rem;
      margin-bottom: 22px; line-height: 1.55;
    }

    .field { margin-bottom: 14px; }
    .field label {
      display: block; font-size: 0.78rem; color: var(--text-muted);
      margin-bottom: 6px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.06em;
    }
    .input-wrap { position: relative; display: flex; align-items: center; }
    .input-wrap .icon {
      position: absolute; left: 13px; font-size: 0.9rem; opacity: 0.5;
    }
    input {
      width: 100%;
      padding: 11px 14px 11px 38px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      color: var(--text-primary); font-size: 0.9rem;
      font-family: 'Plus Jakarta Sans', sans-serif;
      outline: none;
      transition: border-color 0.18s, box-shadow 0.18s;
    }
    input::placeholder { color: var(--text-disabled); }
    input:focus {
      border-color: var(--brand-primary);
      box-shadow: 0 0 0 3px var(--danger-bg);
      background: var(--surface-elevated);
    }
    .pw-toggle {
      position: absolute; right: 12px;
      background: none; border: none;
      cursor: pointer; font-size: 0.9rem;
      color: var(--text-muted);
      transition: color 0.15s;
    }
    .pw-toggle:hover { color: var(--text-primary); }

    .btn-submit {
      width: 100%; padding: 13px;
      background: var(--brand-primary); color: #fff;
      border: none; border-radius: var(--radius-md);
      font-family: 'Fraunces', serif; font-size: 0.95rem; font-weight: 700;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      box-shadow: 0 3px 0 var(--brand-primary-active);
      transition: transform 0.15s, box-shadow 0.15s;
      letter-spacing: 0.01em;
      margin-top: 6px;
    }
    .btn-submit:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 5px 0 var(--brand-primary-active);
    }
    .btn-submit:active:not(:disabled) {
      transform: translateY(1px);
      box-shadow: 0 2px 0 var(--brand-primary-active);
    }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .alert {
      display: none; padding: 11px 14px;
      border-radius: var(--radius-md);
      font-size: 0.83rem; margin-bottom: 14px; line-height: 1.5;
    }
    .alert.error {
      display: block;
      background: var(--danger-bg); color: var(--danger);
      border: 1px solid var(--danger-border);
    }
    .alert.success {
      display: block;
      background: var(--success-bg); color: var(--success);
      border: 1px solid var(--success-border);
    }

    .spinner {
      display: none; width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.35);
      border-top-color: #fff; border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .bottom-note {
      text-align: center; margin-top: 18px;
      font-size: 0.82rem; color: var(--text-muted);
    }
    .bottom-note a {
      color: var(--brand-primary); text-decoration: none;
      cursor: pointer; font-weight: 600;
    }
    .bottom-note a:hover { text-decoration: underline; }

    @media (max-width: 480px) {
      .card { padding: 26px 18px; }
    }
  </style>
</head>
<body>
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>

  <div class="auth-wrapper">
    <a href="index.html" class="logo-link"><span class="logo-text">Aure<span>lis</span></span></a>

    <div class="card">
      <h1>🔑 Reset Your Password</h1>
      <div class="sub" id="reset-sub">Enter a new password for your account.</div>

      <div class="alert" id="reset-error"></div>

      <div id="reset-form">
        <div class="field">
          <label>New Password</label>
          <div class="input-wrap">
            <span class="icon">🔒</span>
            <input type="password" id="new-password" placeholder="At least 8 characters"/>
            <button class="pw-toggle" onclick="togglePw('new-password', this)">👁️</button>
          </div>
        </div>
        <div class="field">
          <label>Confirm Password</label>
          <div class="input-wrap">
            <span class="icon">🔒</span>
            <input type="password" id="confirm-password" placeholder="Re-enter password"/>
          </div>
        </div>
        <button class="btn-submit" id="reset-btn" onclick="handleReset()">
          <span class="spinner" id="reset-spinner"></span>
          <span id="reset-btn-text">Update Password →</span>
        </button>
      </div>

      <div class="bottom-note">
        <a href="login.html">← Back to Login</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL  = 'https://tbdslkstlsshbowqtufq.supabase.co';
    const SUPABASE_ANON = 'sb_publishable_7RRIoqiERasKAsJDhfwTiA_h-Ee-R5t';
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

    function togglePw(id, btn) {
      const inp = document.getElementById(id);
      inp.type = inp.type === 'password' ? 'text' : 'password';
      btn.textContent = inp.type === 'password' ? '👁️' : '🙈';
    }

    function showAlert(type, msg) {
      const el = document.getElementById('reset-error');
      el.className = `alert ${type}`;
      el.textContent = msg;
    }
    function clearAlert() {
      const el = document.getElementById('reset-error');
      el.className = 'alert';
      el.textContent = '';
    }
    function setLoading(on) {
      document.getElementById('reset-btn').disabled = on;
      document.getElementById('reset-spinner').style.display = on ? 'block' : 'none';
      document.getElementById('reset-btn-text').style.opacity = on ? 0.4 : 1;
    }

    async function handleReset() {
      clearAlert();
      const pass    = document.getElementById('new-password').value;
      const confirm = document.getElementById('confirm-password').value;

      if (!pass || pass.length < 8) {
        showAlert('error', 'Password must be at least 8 characters.'); return;
      }
      if (pass !== confirm) {
        showAlert('error', 'Passwords do not match.'); return;
      }

      setLoading(true);
      const { error } = await sb.auth.updateUser({ password: pass });
      setLoading(false);

      if (error) {
        showAlert('error', error.message); return;
      }
      showAlert('success', '✅ Password updated! Redirecting to your dashboard...');
      document.getElementById('reset-form').style.display = 'none';
      setTimeout(() => window.location.href = 'dashboard.html', 1500);
    }

    // supabase-js v2 uses the PKCE flow by default for email links, so the
    // reset link arrives as "reset-password.html?code=xxxxx" — the session
    // is NOT created automatically. We must explicitly exchange that code
    // for a session before this page can call updateUser().
    (async () => {
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code');

      let session = null;

      if (code) {
        const { data, error } = await sb.auth.exchangeCodeForSession(code);
        if (!error) session = data.session;
      } else {
        // Fallback for older-style links that still use the URL hash
        // (#access_token=...&type=recovery) instead of ?code=.
        const existing = await sb.auth.getSession();
        session = existing.data.session;
      }

      if (!session) {
        document.getElementById('reset-sub').textContent =
          'This reset link looks invalid or has expired.';
        document.getElementById('reset-form').style.display = 'none';
        showAlert('error', 'Please request a new reset link from the Login page.');
      }
    })();
  </script>
</body>
</html>
