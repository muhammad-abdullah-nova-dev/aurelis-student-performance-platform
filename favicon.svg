<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C63D2F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3E7A54;stop-opacity:1" />
